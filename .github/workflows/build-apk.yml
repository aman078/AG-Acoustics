name: Build AGSoft Acoustics Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log || { echo "=== GRADLE FAILED ==="; tail -n 80 gradle.log; exit 1; }

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle.log
          if-no-files-found: ignore

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AGSoft-Acoustics.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGSoft-Acoustics-Android-APK
          path: android/app/build/outputs/apk/debug/AGSoft-Acoustics.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AGSoft Acoustics v1.0.${{ github.run_number }}
          body: |
            ### 🎸 AGSoft Acoustics Android APK
            Tap `AGSoft-Acoustics.apk` below to download directly to your Android phone!
          files: android/app/build/outputs/apk/debug/AGSoft-Acoustics.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
