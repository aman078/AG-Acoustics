    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agsoft_theme');
          var isClean = saved === null ? true : (saved === 'clean');
          var root = document.documentElement;
          if (isClean) {
            root.classList.add('clean-theme');
            root.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          } else {
            root.classList.remove('clean-theme');
            root.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0a0c10');
          }
        } catch (e) {}
      })();
    </script>
    <style>html.clean-theme,html.clean-theme body{color:#0f172a!important;background-color:#fff!important}html.dark,html.dark body{color:#f1f5f9!important;background-color:#08090d!important}</style>

  <body class="bg-white dark:bg-[#08090d] text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script>
      (function() {
        var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (isNative) {
          // Inside native Capacitor APK, unregister any legacy service worker and clear stale caches
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
        } else if ('serviceWorker' in navigator) {
          // On web browser, register resilient sw.js
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.onupdatefound = function() {
                var installing = reg.installing;
                if (installing) {
                  installing.onstatechange = function() {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New AGSoft Acoustics update ready.');
                    }
                  };
                }
              };
            }).catch(console.error);
          });
        }
      })();
    </script>
  </body>
